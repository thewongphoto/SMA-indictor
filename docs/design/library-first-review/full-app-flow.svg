<text x="116" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#eaf6f3">01 / First visit — empty library</text>
<text x="116" y="318" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">First card: New to moving averages and upward</text>
<text x="116" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">crossing buy signals? → guided example</text>
<text x="116" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">New analysis → security search</text>
<text x="116" y="387" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Recently unsaved → archive; gear → Settings</text>
<rect x="1002" y="255" width="500" height="180" rx="14" fill="#dce7e3" stroke="none"/>
