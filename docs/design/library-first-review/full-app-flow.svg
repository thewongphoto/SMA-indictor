<text x="116" y="988" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Three-year chart with many crossings.</text>
<text x="116" y="1011" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Recovery may follow; losses can too.</text>
