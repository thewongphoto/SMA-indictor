name: Check iPhone web app
on:
  push:
    branches: [main]
    tags: ['apk-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install requests certifi tzdata playwright
      - run: python -m unittest tests.test_web_service -v
      - run: npm ci --prefix web
      # Stage native brand assets before checking their web copies.
      - run: npm run build --prefix web
      - run: npm test --prefix web
      - run: bash scripts/check_contact_sql.sh
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m scripts.smoke_web
      - run: python -m scripts.smoke_local_web
      - run: python -m scripts.smoke_chart_webkit
      - run: python -m scripts.smoke_setup_feedback
      - run: python -m scripts.smoke_signup_web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-web-validation
          path: |
            artifacts/web-ui/
            artifacts/local-web/
            artifacts/chart-webkit/
            artifacts/setup-feedback/
            artifacts/signup-web/
