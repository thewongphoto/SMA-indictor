<text x="1016" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#eaf6f3">05 / Returning visit — populated library</text>
<text x="1016" y="318" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Always the launch state when at least one SMA exists.</text>
<text x="1016" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Logo / company / ticker groups expand into saved lines.</text>
<text x="1016" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">View → exact saved chart; New analysis → search.</text>
<text x="1016" y="387" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Heart / Hide / phone controls; history → archive.</text>
