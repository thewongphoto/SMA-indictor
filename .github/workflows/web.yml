name: Check iPhone web app
on:
  push:
    branches: [main]
    tags: ['apk-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install requests certifi tzdata playwright
      - run: python -m unittest tests.test_web_service -v
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.smoke_web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-web-validation
          path: artifacts/web-ui/
