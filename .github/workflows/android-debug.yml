name: Build Android APK
on:
  push:
    tags:
      - "apk-v*"
  workflow_dispatch:
    inputs:
      persist_signing_key:
        description: 'One-time: save the existing cached key as a durable Actions secret (see guide)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux build dependencies
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash scripts/install_android_deps.sh 2>&1 | tee artifacts/android-deps.log
      - name: Install Python build and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-android.txt -r requirements.txt -r requirements-validation.txt
      - name: Run calculation, Yahoo transport, cache and signing regression tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m unittest discover -s tests -v 2>&1 | tee artifacts/unit-tests.log
          python -m scripts.check_repository_docs 2>&1 | tee artifacts/docs-check.log
      - name: Run Kivy UI regression checks
        env:
          KIVY_HOME: ${{ github.workspace }}/.local/kivy
          XDG_CACHE_HOME: ${{ github.workspace }}/.local/cache
          KIVY_NO_ARGS: '1'
          KIVY_CLIPBOARD: xclip
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          mkdir -p "$KIVY_HOME" "$XDG_CACHE_HOME" artifacts
          xvfb-run -a python -m scripts.smoke_ui 2>&1 | tee artifacts/ui-smoke.log
          xvfb-run -a python -m scripts.smoke_ui --library-flow-only 2>&1 | tee artifacts/ui-library-flow.log
          xvfb-run -a python -m scripts.smoke_mobile_yahoo_ui 2>&1 | tee artifacts/mobile-yahoo-ui.log
          xvfb-run -a python -m scripts.smoke_ui_refinements 2>&1 | tee artifacts/ui-refinements.log
          xvfb-run -a python -m scripts.smoke_ui_flow 2>&1 | tee artifacts/ui-flow.log
          xvfb-run -a python -m scripts.smoke_ui_redesign 2>&1 | tee artifacts/ui-redesign.log
          xvfb-run -a python -m scripts.smoke_ui_signup 2>&1 | tee artifacts/ui-signup.log
          xvfb-run -a python -m scripts.smoke_ui_motion 2>&1 | tee artifacts/ui-motion.log
          # Exercise a deliberately slow frame clock: continuity must not rely on a fixed FPS.
          KCFG_GRAPHICS_MAXFPS=12 xvfb-run -a python -m scripts.smoke_ui_color_logos 2>&1 | tee artifacts/ui-color-logos.log
          xvfb-run -a python -m scripts.smoke_notification_jobs 2>&1 | tee artifacts/ui-notification-jobs.log
      - name: Restore verified source archives
        id: native-sources
        uses: actions/cache/restore@v4
        with:
          path: .local/native-archives
          key: android-sources-v1-${{ hashFiles('scripts/native-archives.json') }}
      - name: Fetch and verify native source archives before building
        run: |
          set -o pipefail
          python -m scripts.prepare_android_sources 2>&1 | tee artifacts/android-native-sources.log
      - name: Save verified sources before native compilation
        if: steps.native-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .local/native-archives
          key: android-sources-v1-${{ hashFiles('scripts/native-archives.json') }}
      - name: Reuse debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sma-android-debug-key-v1
      - name: Prepare debug signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_EXPECTED_SHA1: ${{ vars.ANDROID_SIGNING_SHA1 }}
        run: |
          python -m scripts.prepare_android_signing
      - name: Persist the existing signing identity (one-time migration)
        if: ${{ inputs.persist_signing_key }}
        env:
          GH_TOKEN: ${{ secrets.SIGNING_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Add SIGNING_ADMIN_TOKEN in repository Actions secrets first; see the signing guide."
            exit 1
          fi
          base64 -w 0 "$HOME/.android/debug.keystore" | gh secret set ANDROID_DEBUG_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
          signing_sha1=$(sed -n 's/^SHA1: //p' artifacts/android-signing-info.txt)
          gh variable set ANDROID_SIGNING_SHA1 --body "$signing_sha1" --repo "$GITHUB_REPOSITORY"
      - name: Build signed release APK
        run: |
          set -o pipefail
          export P4A_RELEASE_KEYSTORE="$HOME/.android/debug.keystore"
          export P4A_RELEASE_KEYALIAS=androiddebugkey
          export P4A_RELEASE_KEYSTORE_PASSWD=android
          export P4A_RELEASE_KEYALIAS_PASSWD=android
          buildozer -v android release 2>&1 | tee artifacts/android-build.log
      - name: Verify final APK identity and release policy
        run: |
          python -m scripts.verify_android_apk
      - name: Upload verified APK and package report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sma-android-test
          if-no-files-found: error
          path: |
            bin/*.apk
            artifacts/android-signing-info.txt
            artifacts/android-apk-verification.json
      - name: Upload validation and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sma-android-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/android-deps.log
            artifacts/android-signing-info.txt
            artifacts/android-apk-verification.json
            artifacts/android-build.log
            artifacts/android-apk-signature.txt
            artifacts/android-native-sources.log
            artifacts/unit-tests.log
            artifacts/docs-check.log
            artifacts/ui-smoke.log
            artifacts/ui-smoke.json
            artifacts/ui-library-flow.log
            artifacts/ui-library-flow.json
            artifacts/mobile-yahoo-ui.log
            artifacts/mobile-yahoo-ui-smoke.json
            artifacts/ui-refinements.log
            artifacts/ui-refinements-smoke.json
            artifacts/ui-flow.log
            artifacts/ui-flow-smoke.json
            artifacts/ui-signup.log
            artifacts/signup-ui/
            artifacts/ui-motion.log
            artifacts/ui-motion-smoke.json
            artifacts/ui-color-logos.log
            artifacts/ui-notification-jobs.log
            artifacts/ui-notification-jobs.json
            artifacts/ui-color-logos-smoke.json
