<text x="116" y="628" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Partial ticker / company query.</text>
<text x="116" y="651" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Enter or Submit → local matches.</text>
<text x="116" y="674" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Logo / ticker / name → select.</text>
<text x="116" y="697" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">No-match / failure → retry here.</text>
<text x="116" y="720" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Typing alone makes no request.</text>
