<text x="116" y="1080" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">$100-per-buy investment comparisons.</text>
<text x="116" y="1103" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Choose own security → Search.</text>
