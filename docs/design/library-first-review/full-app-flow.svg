<text x="616" y="587" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#eaf6f3">03 / Parameters + Custom</text>
<text x="616" y="628" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Company logo and name.</text>
<text x="616" y="651" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Target upward crossings / year.</text>
<text x="616" y="674" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Custom expands simulation settings.</text>
<text x="616" y="697" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Optimize; invalid input stays here.</text>
<text x="616" y="720" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#607789">Loading disables conflicting actions.</text>
