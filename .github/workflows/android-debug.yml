name: Build Android test APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements-android.txt
      - name: Reuse debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sma-android-debug-key-v1
      - name: Prepare debug identity for Google OAuth
        run: |
          mkdir -p "$HOME/.android" artifacts
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android > artifacts/android-signing-info.txt
          printf 'Android package: org.thewongphoto.smaanalyzer\n' >> artifacts/android-signing-info.txt
      - name: Build portrait debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee artifacts/android-build.log
      - name: Upload test APK and OAuth fingerprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sma-android-test
          if-no-files-found: warn
          path: |
            bin/*.apk
            artifacts/android-signing-info.txt
            artifacts/android-build.log
