name: Build private iPhone Xcode kit
on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official iOS build tooling
        run: |
          brew install autoconf automake libtool pkg-config
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ios-build.txt -r requirements-validation.txt
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/ios-xcode-version.txt
      - name: Cache compiled native libraries
        uses: actions/cache@v4
        with:
          path: .build-ios/toolchain
          key: ios-native-v3-${{ runner.arch }}-${{ hashFiles('artifacts/ios-xcode-version.txt', 'requirements-ios-build.txt', 'requirements-ios.txt', 'ios/recipes/**/*.py', 'ios/native-sources.json', 'scripts/native-archives.json') }}
      - name: Restore verified native source archives
        id: native-sources
        uses: actions/cache/restore@v4
        with:
          path: |
            .build-ios/toolchain/.cache/hostopenssl-openssl-1.1.1w.tar.gz
            .build-ios/toolchain/.cache/openssl-openssl-1.1.1w.tar.gz
            .build-ios/toolchain/.cache/kivy-2.3.1.zip
            .build-ios/toolchain/.cache/pyobjus-0c204ada4a5aa4f065ac65fc678c6cb35e4dcb81.zip
          key: ios-sources-v2-${{ hashFiles('ios/native-sources.json', 'scripts/native-archives.json') }}
      - name: Validate calculations, cache, notifications and packaging
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee artifacts/ios-unit-tests.log
      - name: Fetch and verify the pinned iPhone source archives
        run: |
          set -o pipefail
          python -m scripts.prepare_ios_sources .build-ios/toolchain/.cache 2>&1 | tee artifacts/ios-native-sources.log
          python -m scripts.check_ios_source_probe .build-ios/toolchain/.cache 2>&1 | tee artifacts/ios-source-probe.log
      - name: Save verified sources before compiling native libraries
        if: steps.native-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build-ios/toolchain/.cache/hostopenssl-openssl-1.1.1w.tar.gz
            .build-ios/toolchain/.cache/openssl-openssl-1.1.1w.tar.gz
            .build-ios/toolchain/.cache/kivy-2.3.1.zip
            .build-ios/toolchain/.cache/pyobjus-0c204ada4a5aa4f065ac65fc678c6cb35e4dcb81.zip
          key: ios-sources-v2-${{ hashFiles('ios/native-sources.json', 'scripts/native-archives.json') }}
      - name: Compile Python, Kivy and the iPhone project
        run: |
          set -o pipefail
          python -m scripts.prepare_ios 2>&1 | tee artifacts/ios-toolchain-build.log
      - name: Build the unsigned iPhone device app
        run: |
          set -o pipefail
          xcodebuild -project .build-ios/toolchain/smaanalyzer-ios/smaanalyzer.xcodeproj \
            -scheme smaanalyzer -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build-ios/device build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/ios-device-build.log
          python -m scripts.make_iphone_kit .build-ios/device/Build/Products/Release-iphoneos/smaanalyzer.app artifacts/sma-iphone-xcode-kit
      - name: Verify the downloadable signing project copies the compiled app
        run: |
          set -o pipefail
          xcodebuild -project artifacts/sma-iphone-xcode-kit/SMA-iPhone.xcodeproj \
            -scheme smaanalyzer -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath .build-ios/signing-kit build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/ios-signing-kit-build.log
          python -m scripts.verify_iphone_kit .build-ios/signing-kit/Build/Products/Debug-iphoneos/smaanalyzer.app artifacts/sma-iphone-xcode-kit/BUILD_INFO.json
      - name: Build the separate simulator QA app
        run: |
          set -o pipefail
          python -m scripts.prepare_ios --simulator-smoke --reuse-toolchain
          xcodebuild -project .build-ios/toolchain/smaanalyzer-ios/smaanalyzer.xcodeproj \
            -scheme smaanalyzer -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-ios/simulator build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 \
            2>&1 | tee artifacts/ios-simulator-build.log
      - name: Check two native simulator launches and persisted saves
        timeout-minutes: 10
        run: |
          set -o pipefail
          python -m scripts.check_ios_simulator .build-ios/simulator/Build/Products/Debug-iphonesimulator/smaanalyzer.app \
            2>&1 | tee artifacts/ios-simulator-check.log
      - name: Upload the Personal Team installation kit
        uses: actions/upload-artifact@v4
        with:
          name: sma-iphone-xcode-kit
          path: artifacts/sma-iphone-xcode-kit/
          if-no-files-found: error
      - name: Upload native build and simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sma-iphone-build-logs
          if-no-files-found: warn
          path: |
            artifacts/ios-*.log
            artifacts/ios-xcode-version.txt
            artifacts/ios-simulator/
